name: Attach release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Upload RaftBootstrap.cmake to the release
        run: gh release upload "$TAG" scripts/RaftBootstrap.cmake --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
      - name: Build DeviceTypeRecords.json (every RaftCore record, one file) and upload it to the release
        run: |
          python3 scripts/AssembleDeviceTypes.py --raftcore . --all --out DeviceTypeRecords.json
          gh release upload "$TAG" DeviceTypeRecords.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
